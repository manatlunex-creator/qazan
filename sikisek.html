<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body { background: #121212; color: #fff; font-family: Arial; padding: 20px; }
        .login-box, .admin-panel { max-width: 900px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        input, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #444; padding: 10px; text-align: left; font-size: 13px; vertical-align: top; }
        th { background: #333; }
        .btn-danger { background: #ff4444; color: #fff; border: none; cursor: pointer; padding: 6px; }
        .btn-warning { background: #ffbb33; color: #000; border: none; cursor: pointer; padding: 6px; }
        .btn-success { background: #00C851; color: #fff; border: none; cursor: pointer; }
        .btn-info { background: #33b5e5; color: #fff; border: none; cursor: pointer; padding: 6px; }
        
        .admin-chat-box {
            background: #111;
            border: 1px solid #444;
            height: 100px;
            overflow-y: auto;
            padding: 5px;
            margin-bottom: 5px;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div id="loginSection" class="login-box">
        <h3>Admin Girişi</h3>
        <input type="text" id="username" placeholder="İstifadəçi adı">
        <input type="password" id="password" placeholder="Şifrə">
        <button onclick="adminLogin()">Daxil ol</button>
    </div>

    <div id="panelSection" class="admin-panel" style="display:none;">
        <h3>Admin Panel - Canlı Dəstək və İdarəetmə</h3>
        
        <div>
            <h4>Yeni Kod Yarat</h4>
            <input type="text" id="newCodeInput" placeholder="4 rəqəmli kod yazın" maxlength="4">
            <button class="btn-success" onclick="createCode()">Kod Əlavə Et</button>
        </div>

        <hr style="border-color: #444; margin: 20px 0;">

        <h4>Daxil olan Sorğular və İstifadəçi Söhbətləri</h4>
        <table>
            <thead>
                <tr>
                    <th>Kod / Nömrə</th>
                    <th>Canlı Chat (Dəstək)</th>
                    <th>Əməliyyatlar</th>
                </tr>
            </thead>
            <tbody id="requestsTable">
                <!-- Sorğular və chatlar burada görünəcək -->
            </tbody>
        </table>

        <h4 style="margin-top: 30px;">Yaradılmış Kodlar Siyahısı</h4>
        <table>
            <thead>
                <tr>
                    <th>Kod</th>
                    <th>Status</th>
                    <th>İdarəetmə</th>
                </tr>
            </thead>
            <tbody id="codesTable">
                <!-- Kodlar burada görünəcək -->
            </tbody>
        </table>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://ahhseks-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function adminLogin() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;

            if (user === "K9ESCOBAR211_" && pass === "AA555_67") {
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("panelSection").style.display = "block";
                loadCodes();
                loadRequests();
            } else {
                alert("İstifadəçi adı və ya şifrə səhvdir!");
            }
        }

        function createCode() {
            const code = document.getElementById("newCodeInput").value.trim();
            if (code.length === 4) {
                db.ref("codes/" + code).set({
                    active: true,
                    banned: false
                }, (error) => {
                    if (!error) {
                        alert("Kod uğurla yaradıldı!");
                        document.getElementById("newCodeInput").value = "";
                    }
                });
            } else {
                alert("Kod 4 rəqəmli olmalıdır.");
            }
        }

        function loadCodes() {
            const tbody = document.getElementById("codesTable");
            db.ref("codes").on("value", snapshot => {
                tbody.innerHTML = "";
                snapshot.forEach(childSnapshot => {
                    const data = childSnapshot.val();
                    const codeKey = childSnapshot.key;

                    let row = `<tr>
                        <td><b>${codeKey}</b></td>
                        <td>${data.banned ? 'Banlanıب' : 'Aktiv'}</td>
                        <td>
                            <button class="btn-warning" onclick="toggleBan('${codeKey}', ${data.banned})">${data.banned ? 'Banı Aç' : 'Banla'}</button>
                            <button class="btn-danger" onclick="deleteCode('${codeKey}')">Sil</button>
                        </td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            });
        }

        function loadRequests() {
            const tbody = document.getElementById("requestsTable");
            db.ref("requests").on("value", snapshot => {
                tbody.innerHTML = "";
                snapshot.forEach(childSnapshot => {
                    const data = childSnapshot.val();
                    const codeKey = childSnapshot.key;

                    let row = `<tr>
                        <td><b>Kod:</b> ${data.code}<br><b>Nömrə:</b> ${data.phone}</td>
                        <td>
                            <div class="admin-chat-box" id="adminChat_${codeKey}">
                                <i style="color:#777;">Yüklənir...</i>
                            </div>
                            <input type="text" id="reply_${codeKey}" placeholder="Mesaj yazın...">
                            <button class="btn-info" onclick="sendAdminMessage('${codeKey}')">Cavab Göndər</button>
                        </td>
                        <td>
                            <button class="btn-warning" onclick="closeChat('${codeKey}')">Chatı Bağla</button>
                            <button class="btn-danger" onclick="banAndRemove('${codeKey}')" style="margin-top:5px;">Banla & Sil</button>
                        </td>
                    </tr>`;
                    tbody.innerHTML += row;

                    // Hər istifadəçinin chat mesajlarını admin paneldə oxumaq
                    db.ref("chats/" + codeKey).on("value", chatSnap => {
                        const chatBox = document.getElementById("adminChat_" + codeKey);
                        if (!chatBox) return;
                        chatBox.innerHTML = "";
                        if (chatSnap.exists()) {
                            chatSnap.forEach(msgChild => {
                                const msg = msgChild.val();
                                chatBox.innerHTML += `<div><b>${msg.sender}:</b> ${msg.text}</div>`;
                            });
                            chatBox.scrollTop = chatBox.scrollHeight;
                        } else {
                            chatBox.innerHTML = `<i style="color:#777;">Mesaj yoxdur</i>`;
                        }
                    });
                });
            });
        }

        function sendAdminMessage(codeKey) {
            const text = document.getElementById("reply_" + codeKey).value.trim();
            if (!text) return;

            db.ref("chats/" + codeKey).push({
                sender: "Admin",
                text: text,
                timestamp: Date.now()
            });

            document.getElementById("reply_" + codeKey).value = "";
        }

        function closeChat(codeKey) {
            db.ref("chats/" + codeKey).remove().then(() => {
                alert("Chat bağlandı və təmizləndi.");
            });
        }

        function banAndRemove(codeKey) {
            db.ref("codes/" + codeKey).update({ banned: true, active: false });
            db.ref("requests/" + codeKey).remove();
            db.ref("chats/" + codeKey).remove();
            alert("İstifadəçi banlandı və məlumatlar silindi.");
        }

        function deleteCode(codeKey) {
            db.ref("codes/" + codeKey).remove();
            db.ref("requests/" + codeKey).remove();
            db.ref("chats/" + codeKey).remove();
            alert("Kod tamamilə silindi.");
        }
    </script>
</body>
</html>
