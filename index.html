<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Çark - Telegram Mini App</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b16;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            position: relative;
            padding-bottom: 20px;
        }

        /* Animasiyalı Arxa Fon (Neon Parıltılar) */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            background: linear-gradient(135deg, #0b0b16 0%, #1a0b2e 100%);
        }

        .circle-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 8s infinite alternate ease-in-out;
        }

        .c1 {
            width: 300px;
            height: 300px;
            background: #ff007f;
            top: -50px;
            left: -50px;
        }

        .c2 {
            width: 350px;
            height: 350px;
            background: #00f3ff;
            bottom: -50px;
            right: -50px;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        /* Başlıq */
        header {
            margin-top: 15px;
            text-align: center;
            z-index: 2;
            padding: 0 10px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8),
                         0 0 20px rgba(0, 243, 255, 0.6),
                         0 0 30px rgba(0, 243, 255, 0.4);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        /* Yanıb-sönən Diqqət Çəkən Banner (İri) */
        .prize-banner {
            background: linear-gradient(90deg, rgba(255,0,127,0.3), rgba(0,243,255,0.3), rgba(255,204,0,0.3));
            border: 2px solid #00f3ff;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
            animation: pulseBanner 1.5s infinite alternate;
            margin-bottom: 15px;
            z-index: 2;
            text-transform: uppercase;
        }

        @keyframes pulseBanner {
            0% {
                transform: scale(1);
                box-shadow: 0 0 10px rgba(0, 243, 255, 0.4), inset 0 0 5px rgba(0, 243, 255, 0.4);
                border-color: #00f3ff;
            }
            100% {
                transform: scale(1.04);
                box-shadow: 0 0 25px rgba(255, 0, 127, 0.8), inset 0 0 12px rgba(255, 0, 127, 0.6);
                border-color: #ff007f;
            }
        }

        /* Çark Konteyneri */
        .wheel-container {
            position: relative;
            width: 330px;
            height: 330px;
            margin: 0 auto 15px auto;
            z-index: 2;
        }

        .pointer {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 30px solid #ff007f;
            z-index: 10;
            filter: drop-shadow(0 0 10px #ff007f);
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.5),
                        inset 0 0 20px rgba(255, 0, 127, 0.5);
            border: 5px solid #1f1b3c;
        }

        /* Fırlat Düyməsi */
        .spin-btn {
            background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%);
            color: white;
            border: none;
            padding: 14px 50px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
            transition: 0.2s;
            z-index: 2;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .spin-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.9);
        }

        .spin-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Nəticə pəncərəsi */
        #result-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(18, 18, 35, 0.96);
            border: 3px solid #00f3ff;
            padding: 25px 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.7);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #result-modal.show {
            transform: translate(-50%, -50%) scale(1);
        }

        #result-text {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        #result-modal button {
            background: #00f3ff;
            color: #0b0b16;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
        }
    </style>
</head>
<body>

    <!-- Arxa fon parıltıları -->
    <div class="bg-animation">
        <div class="circle-glow c1"></div>
        <div class="circle-glow c2"></div>
    </div>

    <!-- Başlıq -->
    <header>
        <h1>10 jeton at fırlat qazan</h1>
        <div class="prize-banner">100 Jeton | 50 Jeton | 20 Jeton | 5 Jeton Qazan!</div>
    </header>

    <!-- Çark Bölməsi -->
    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="500" height="500"></canvas>
    </div>

    <!-- Fırlat Düyməsi -->
    <button class="spin-btn" id="spinBtn" onclick="spinWheel()">Fırlat</button>

    <!-- Nəticə pəncərəsi -->
    <div id="result-modal">
        <div id="result-text">Təbriklər!</div>
        <button onclick="closeModal()">OK</button>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'spin') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(660, now + 0.1);
                osc.frequency.setValueAtTime(880, now + 0.2);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'bomb') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.4);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultModal = document.getElementById('result-modal');
        const resultText = document.getElementById('result-text');

        // Çark dilimləri və dəqiq ehtimallar
        const sectors = [
            { label: "Bomba 💥", color: "#ff0055", weight: 95 },
            { label: "Yenidən 🔄", color: "#9d00ff", weight: 50 },
            { label: "100 Jeton 🪙", color: "#00f3ff", weight: 0 },
            { label: "Bomba 💥", color: "#ff1a66", weight: 95 },
            { label: "5 Jeton 🪙", color: "#00ffcc", weight: 0 },
            { label: "Yenidən 🔄", color: "#b533ff", weight: 50 },
            { label: "50 Jeton 🪙", color: "#ffcc00", weight: 0 },
            { label: "Bomba 💥", color: "#ff0055", weight: 95 },
            { label: "20 Jeton 🪙", color: "#ff8800", weight: 0 },
            { label: "Bomba 💥", color: "#cc0044", weight: 95 }
        ];

        const totalSectors = sectors.length;
        const arcSize = (2 * Math.PI) / totalSectors;
        let currentAngle = 0; // Radiandandır
        let isSpinning = false;

        function drawWheel(angleOffset = 0) {
            ctx.clearRect(0, 0, 500, 500);
            ctx.save();
            ctx.translate(250, 250);
            ctx.rotate(angleOffset);

            sectors.forEach((sector, index) => {
                const angle = index * arcSize;
                ctx.save();
                ctx.beginPath();
                ctx.arc(0, 0, 240, angle, angle + arcSize);
                ctx.lineTo(0, 0);
                ctx.fillStyle = sector.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#0b0b16';
                ctx.stroke();

                // Mətnlərin yerləşdirilməsi
                ctx.save();
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 20px Arial";
                ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
                ctx.shadowBlur = 6;
                ctx.fillText(sector.label, 215, 8);
                ctx.restore();
                ctx.restore();
            });

            ctx.restore();
        }

        // Çəkiyə əsaslanan random seçim (0% şanslılar heç vaxt seçilməyəcək)
        function getRandomSectorIndex() {
            const validSectors = sectors.map((s, i) => ({ index: i, weight: s.weight })).filter(s => s.weight > 0);
            const totalWeight = validSectors.reduce((sum, s) => sum + s.weight, 0);
            let randomNum = Math.random() * totalWeight;
            
            for (let s of validSectors) {
                if (randomNum < s.weight) return s.index;
                randomNum -= s.weight;
            }
            return 0;
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;

            const winningIndex = getRandomSectorIndex();
            
            // Hədəf sektorun oxda (yuxarıda, yəni -Math.PI/2 nöqtəsində) dayanması üçün bucaq hesabı
            const spins = 6;
            const sectorAngle = 360 / totalSectors;
            const targetSectorCenter = winningIndex * sectorAngle + sectorAngle / 2;
            const extraDegrees = 360 - targetSectorCenter;
            const totalRotationDeg = (360 * spins) + extraDegrees;
            
            let startTime = performance.now();
            let duration = 4000; // 4 saniyə
            let startAngleDeg = (currentAngle * 180) / Math.PI;
            let finalAngleDeg = startAngleDeg + totalRotationDeg;
            let lastTickDeg = startAngleDeg;

            function animate(currentTime) {
                let elapsed = currentTime - startTime;
                let progress = Math.min(elapsed / duration, 1);
                
                // Ease-out (yavaşlayan) hərəkət
                let easeOut = 1 - Math.pow(1 - progress, 3);
                let currentDeg = startAngleDeg + (finalAngleDeg - startAngleDeg) * easeOut;

                if (Math.floor(currentDeg / sectorAngle) !== Math.floor(lastTickDeg / sectorAngle)) {
                    playSound('spin');
                    lastTickDeg = currentDeg;
                }

                currentAngle = (currentDeg * Math.PI) / 180;
                drawWheel(currentAngle);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    spinBtn.disabled = false;
                    currentAngle = (finalAngleDeg % 360) * Math.PI / 180;

                    const winningLabel = sectors[winningIndex].label;
                    if (winningLabel.includes("Bomba")) {
                        playSound('bomb');
                    } else {
                        playSound('win');
                    }
                    
                    showResult(winningLabel);
                }
            }

            requestAnimationFrame(animate);
        }

        function showResult(text) {
            resultText.innerText = "Nəticə: " + text;
            resultModal.classList.add('show');
        }

        function closeModal() {
            resultModal.classList.remove('show');
        }

        // İlk açılışda çarkı çək
        drawWheel(currentAngle);

        // Telegram WebApp genişləndirmə
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
